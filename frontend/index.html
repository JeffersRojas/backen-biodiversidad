<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodiversidad en Colombia</title>
    <link rel="stylesheet" href="css/styles.css">
    <!-- Font Awesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <i class="fas fa-leaf"></i>
            <h1>Biodiversidad Colombia</h1>
        </div>
        <div class="auth-buttons" id="auth-buttons">
            <!-- Will be populated by JS -->
        </div>
    </header>

    <main class="container">
        <!-- Auth View -->
        <div id="auth-view" class="hidden">
            <div class="form-container">
                <h2 id="auth-title">Iniciar Sesión</h2>
                <form id="auth-form">
                    <div class="form-group" id="email-group" style="display: none;">
                        <label for="email">Correo Electrónico</label>
                        <input type="email" id="email" placeholder="ejemplo@email.com">
                    </div>
                    <div class="form-group">
                        <label for="username">Usuario</label>
                        <input type="text" id="username" required placeholder="Nombre de usuario">
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <input type="password" id="password" required placeholder="******">
                    </div>
                    <div class="form-group" id="role-group" style="display: none;">
                        <label for="roleId">Rol</label>
                        <select id="roleId">
                            <option value="user">Usuario</option>
                            <option value="admin">Administrador</option>
                        </select>
                    </div>
                    <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
                    <p class="toggle-link" id="toggle-auth">¿No tienes cuenta? Regístrate aquí</p>
                </form>
            </div>
        </div>

        <!-- Dashboard View -->
        <div id="dashboard-view" class="hidden">
            <div class="dashboard-header">
                <h2>Catálogo de Fauna Colombiana</h2>
                <p>Explora y gestiona la rica biodiversidad de nuestro país.</p>
                <button id="add-fauna-btn" class="btn-primary"><i class="fas fa-plus"></i> Registrar Nueva Especie</button>
            </div>
            
            <div id="fauna-list" class="fauna-grid">
                <!-- Fauna items will be rendered here -->
                <p>Cargando especies...</p>
            </div>
        </div>
    </main>

    <!-- Fauna Modal -->
    <div id="fauna-modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Registrar Especie</h2>
            <form id="fauna-form">
                <input type="hidden" id="fauna-id">
                <div class="form-group">
                    <label for="nombreComun">Nombre Común</label>
                    <input type="text" id="nombreComun" required placeholder="Ej: Jaguar">
                </div>
                <div class="form-group">
                    <label for="nombreCientifico">Nombre Científico</label>
                    <input type="text" id="nombreCientifico" required placeholder="Ej: Panthera onca">
                </div>
                <div class="form-group">
                    <label for="familia">Familia</label>
                    <input type="text" id="familia" required placeholder="Ej: Felidae">
                </div>
                <div class="form-group">
                    <label for="habitat">Hábitat</label>
                    <input type="text" id="habitat" required placeholder="Ej: Bosques tropicales">
                </div>
                <div class="form-group">
                    <label for="ubicacionGeografica">Ubicación Geográfica</label>
                    <input type="text" id="ubicacionGeografica" required placeholder="Ej: Amazonía, Orinoquía">
                </div>
                <div class="form-group">
                    <label for="peligroExtincion">Estado de Conservación</label>
                    <select id="peligroExtincion">
                        <option value="No">Preocupación Menor</option>
                        <option value="Vulnerable">Vulnerable</option>
                        <option value="En Peligro">En Peligro</option>
                        <option value="Critico">En Peligro Crítico</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
