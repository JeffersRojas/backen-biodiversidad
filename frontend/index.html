<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biodiversidad Colombia - Gestión</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    
    <!-- Auth View -->
    <div id="auth-view">
        <div class="form-card">
            <div style="text-align: center; margin-bottom: 20px;">
                <i class="fas fa-leaf" style="font-size: 3rem; color: var(--primary-color);"></i>
            </div>
            <h2 id="auth-title">Bienvenido</h2>
            <form id="auth-form">
                <div class="form-group" id="email-group" style="display: none;">
                    <label for="email">Correo Electrónico</label>
                    <input type="email" id="email" placeholder="ejemplo@email.com">
                </div>
                <div class="form-group">
                    <label for="username">Usuario</label>
                    <input type="text" id="username" required placeholder="Nombre de usuario">
                </div>
                <div class="form-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" required placeholder="******">
                </div>
                <div class="form-group" id="role-group" style="display: none;">
                    <label for="roleId">Rol</label>
                    <select id="roleId">
                        <option value="user">Usuario</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary" id="submit-btn">Entrar</button>
                <p class="toggle-link" id="toggle-auth">¿No tienes cuenta? Regístrate aquí</p>
            </form>
        </div>
    </div>

    <!-- Dashboard View -->
    <div id="dashboard-view" class="dashboard-container hidden">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <i class="fas fa-globe-americas"></i> BioColombia
            </div>
            <nav class="sidebar-nav">
                <div class="nav-item active" onclick="switchTab('fauna')">
                    <i class="fas fa-paw"></i> Fauna
                </div>
                <div class="nav-item" onclick="switchTab('flora')">
                    <i class="fas fa-seedling"></i> Flora
                </div>
            </nav>
            <div class="sidebar-footer">
                <div class="nav-item" onclick="logout()" style="color: #ffcccb;">
                    <i class="fas fa-sign-out-alt"></i> Cerrar Sesión
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Top Bar -->
            <header class="top-bar">
                <div id="page-title" style="font-weight: bold; font-size: 1.2rem;">Panel de Control</div>
                <div class="user-info" id="user-info-display">
                    <!-- Populated by JS -->
                </div>
            </header>

            <!-- Fauna Section -->
            <section id="fauna-section">
                <div class="section-header">
                    <h2>Gestión de Fauna</h2>
                    <button id="add-fauna-btn" class="btn-add"><i class="fas fa-plus"></i> Nueva Especie</button>
                </div>
                <div id="fauna-list" class="grid-container">
                    <!-- Fauna Cards -->
                    <p>Cargando especies...</p>
                </div>
            </section>

            <!-- Flora Section -->
            <section id="flora-section" class="hidden">
                <div class="section-header">
                    <h2>Gestión de Flora</h2>
                    <button id="add-flora-btn" class="btn-add"><i class="fas fa-plus"></i> Nueva Planta</button>
                </div>
                <div id="flora-list" class="grid-container">
                    <!-- Flora Cards -->
                    <p>Cargando flora...</p>
                </div>
            </section>
        </main>
    </div>

    <!-- Fauna Modal -->
    <div id="fauna-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('fauna-modal')">&times;</span>
            <h2 id="fauna-modal-title">Registrar Especie</h2>
            <form id="fauna-form">
                <input type="hidden" id="fauna-id">
                <div class="form-group">
                    <label for="fauna-nombreComun">Nombre Común</label>
                    <input type="text" id="fauna-nombreComun" required placeholder="Ej: Jaguar">
                </div>
                <div class="form-group">
                    <label for="fauna-nombreCientifico">Nombre Científico</label>
                    <input type="text" id="fauna-nombreCientifico" required placeholder="Ej: Panthera onca">
                </div>
                <div class="form-group">
                    <label for="fauna-familia">Familia</label>
                    <input type="text" id="fauna-familia" required placeholder="Ej: Felidae">
                </div>
                <div class="form-group">
                    <label for="fauna-habitat">Hábitat</label>
                    <input type="text" id="fauna-habitat" required placeholder="Ej: Bosques tropicales">
                </div>
                <div class="form-group">
                    <label for="fauna-ubicacionGeografica">Ubicación Geográfica</label>
                    <input type="text" id="fauna-ubicacionGeografica" required placeholder="Ej: Amazonía">
                </div>
                <div class="form-group">
                    <label for="fauna-peligroExtincion">Estado de Conservación</label>
                    <select id="fauna-peligroExtincion">
                        <option value="No">Preocupación Menor</option>
                        <option value="Vulnerable">Vulnerable</option>
                        <option value="En Peligro">En Peligro</option>
                        <option value="Critico">En Peligro Crítico</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <!-- Flora Modal -->
    <div id="flora-modal" class="modal">
        <div class="modal-content">
            <span class="close" onclick="closeModal('flora-modal')">&times;</span>
            <h2 id="flora-modal-title">Registrar Planta</h2>
            <form id="flora-form">
                <input type="hidden" id="flora-id">
                <div class="form-group">
                    <label for="flora-nombreComun">Nombre Común</label>
                    <input type="text" id="flora-nombreComun" required placeholder="Ej: Orquídea">
                </div>
                <div class="form-group">
                    <label for="flora-nombreCientifico">Nombre Científico</label>
                    <input type="text" id="flora-nombreCientifico" required placeholder="Ej: Cattleya trianae">
                </div>
                <div class="form-group">
                    <label for="flora-familia">Familia</label>
                    <input type="text" id="flora-familia" required placeholder="Ej: Orchidaceae">
                </div>
                <div class="form-group">
                    <label for="flora-tipo">Tipo</label>
                    <input type="text" id="flora-tipo" required placeholder="Ej: Hierba, Arbusto, Árbol">
                </div>
                <div class="form-group">
                    <label for="flora-habitat">Hábitat</label>
                    <input type="text" id="flora-habitat" required placeholder="Ej: Bosques andinos">
                </div>
                <div class="form-group">
                    <label for="flora-ubicacionGeografica">Ubicación Geográfica</label>
                    <input type="text" id="flora-ubicacionGeografica" required placeholder="Ej: Región Andina">
                </div>
                <div class="form-group">
                    <label for="flora-estadoConservacion">Estado de Conservación</label>
                    <select id="flora-estadoConservacion">
                        <option value="Preocupación Menor">Preocupación Menor</option>
                        <option value="Vulnerable">Vulnerable</option>
                        <option value="En Peligro">En Peligro</option>
                        <option value="En Peligro Crítico">En Peligro Crítico</option>
                    </select>
                </div>
                <button type="submit" class="btn-primary">Guardar</button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
